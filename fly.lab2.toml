app = "automated-lab-2"
primary_region = "iad"

[build]

[env]
  PORT = "3002"
  SIMULATION_MODE = "live"
  MAP_FILE = "lab_2.json"
  DB_FILE = "lab_2.sqlite"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "lab2_data"
  destination = "/app/server/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
